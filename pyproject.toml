[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "src"

[project]
name = "fiap-customer-churn"
version = "0.0.1"
description = "O projeto faz parte da conclus\u00e3o da Fase 1 da p\u00f3s tech em engenharia de machine learning da FIAP."
authors = [
  { name = "Karla Gomes de Souza" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.162.0",
    "imblearn>=0.0",
    "joblib>=1.6.0",
    "kagglehub>=1.0.3",
    "logger>=1.4",
    "loguru>=0.7.3",
    "missingno>=0.5.2",
    "mlflow>=3.17.2",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]


[tool.ruff]
line-length = 99
src = ["."]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
